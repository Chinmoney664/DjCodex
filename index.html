<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex - DJ Shows and Links</title>
  <meta name="description" content="Upcoming shows and event links for DJ Codex.">
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
  <header class="site-header" aria-label="Site navigation">
    <a class="nav-logo" href="#home" aria-label="Codex home">Codex</a>
    <nav class="main-nav" aria-label="Primary navigation">
      <a href="#events">Events</a>
    </nav>
  </header>

  <main id="home">
    <section class="hero" aria-label="Codex artist intro">
      <div class="hero-image" aria-hidden="true"></div>
      <div class="hero-shade" aria-hidden="true"></div>

      <div class="hero-content">
        <h1 class="sr-only">Codex</h1>
        <div class="glitch-logo" aria-hidden="true">
          <img class="hero-logo" src="codex-logo-transparent.png" alt="">
        </div>
        <p class="genre-line">Mando-pop • K-pop • EDM</p>
      </div>

      <a class="next-card" href="#" aria-label="Next event" data-next-event></a>
    </section>

    <section class="section-block events-block" id="events" aria-labelledby="events-title">
      <div class="section-heading">
        <p class="eyebrow">Upcoming</p>
        <h2 id="events-title">Events</h2>
      </div>

      <div class="event-list" data-upcoming-events></div>
      <p class="empty-state" data-empty-upcoming hidden>New dates coming soon.</p>
    </section>

    <section class="section-block admin-archive" aria-labelledby="past-events-title" data-admin-archive hidden>
      <div class="section-heading">
        <p class="eyebrow">Private archive</p>
        <h2 id="past-events-title">Past Events</h2>
        <p class="admin-note">Only shows when you open this page with <code>?admin=1</code>.</p>
      </div>

      <div>
        <p class="archive-count" data-past-count>0 saved</p>
        <div class="event-list" data-past-events></div>
      </div>
    </section>

  </main>
  <script src="events.js"></script>
  <script src="site.js"></script>
</body>
</html>
