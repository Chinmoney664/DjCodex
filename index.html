<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex - DJ Shows and Links</title>
  <meta name="description" content="Upcoming shows, tickets and links for DJ Codex, New York.">
  <meta name="theme-color" content="#050505">
  <link rel="stylesheet" href="mockup.css">
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>

  <main class="link-page">
    <header class="profile">
      <h1 class="sr-only">Codex</h1>
      <div class="glitch-logo" aria-hidden="true">
        <img class="hero-logo" src="codex-logo-transparent.png" alt="">
      </div>
    </header>

    <section class="upcoming-shows" aria-labelledby="upcoming-title">
      <h2 class="list-title" id="upcoming-title">Upcoming shows</h2>
      <div class="show-list" data-upcoming-events></div>
      <p class="empty-state" data-empty-upcoming hidden>New dates soon — follow us on Instagram.</p>
    </section>

    <div class="links-group">
      <nav class="link-list" aria-label="Codex links" data-links></nav>
      <nav class="social-row" aria-label="Social media and email" data-social-links></nav>
    </div>

    <section class="admin-archive" aria-labelledby="past-events-title" data-admin-archive hidden>
      <h2 class="list-title" id="past-events-title">Past events <span data-past-count></span></h2>
      <p class="admin-note">Only shows when you open this page with <code>?admin=1</code>.</p>
      <div class="show-list" data-past-events></div>
    </section>

    <footer class="site-footer">© Codex NYC</footer>
  </main>

  <script src="events.js"></script>
  <script src="links.js"></script>
  <script src="site.js"></script>
</body>
</html>
