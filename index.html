  <style>
    .codex-logo .ltr {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: ltr-in 0.65s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .ltr:nth-child(1){animation-delay:0.05s}
    .ltr:nth-child(2){animation-delay:0.17s}
    .ltr:nth-child(3){animation-delay:0.29s}
    .ltr:nth-child(4){animation-delay:0.41s}
    .ltr:nth-child(5){animation-delay:0.53s}
    @keyframes ltr-in{
      from{opacity:0;transform:scaleX(0.82) scaleY(0.9)}
      to  {opacity:1;transform:none}
    }
    .codex-logo #logo-base{
      animation: logo-glow 4s ease-in-out 1.8s infinite;
    }
    @keyframes logo-glow{
      0%,100%{filter:drop-shadow(0 0 2px rgba(255,255,255,.2))}
      50%    {filter:drop-shadow(0 0 14px rgba(255,255,255,.55)) drop-shadow(0 0 28px rgba(255,255,255,.2))}
    }
    .codex-logo #gr{fill:rgb(255,55,55);opacity:0;animation:g-r 9s steps(1) 3s infinite}
    .codex-logo #gb{fill:rgb(55,210,255);opacity:0;animation:g-b 9s steps(1) 3s infinite}
    @keyframes g-r{
      0%,86%,100%{opacity:0;clip-path:inset(0 0 100% 0);transform:none}
      87%{opacity:.7;clip-path:inset(12% 0 52% 0);transform:translateX(-5px)}
      88%{opacity:.7;clip-path:inset(55% 0 12% 0);transform:translateX(5px)}
      89%{opacity:0;clip-path:inset(0 0 100% 0);transform:none}
    }
    @keyframes g-b{
      0%,86%,100%{opacity:0;clip-path:inset(0 0 100% 0);transform:none}
      87%{opacity:.65;clip-path:inset(50% 0 12% 0);transform:translateX(5px)}
      88%{opacity:.65;clip-path:inset(15% 0 45% 0);transform:translateX(-5px)}
      89%{opacity:0;clip-path:inset(0 0 100% 0);transform:none}
    }
  </style>

  <script>
    const TARGET = new Date('2026-05-15T22:00:00');
    function pad(n){return String(n).padStart(2,'0')}
    function tick(){
      const diff=TARGET-Date.now();
      if(diff<=0){document.getElementById('countdown').innerHTML='<span class="cd-live">&#9679; TONIGHT</span>';return;}
      const d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),
            m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);
      document.getElementById('cd-d').textContent=pad(d);
      document.getElementById('cd-h').textContent=pad(h);
      document.getElementById('cd-m').textContent=pad(m);
      document.getElementById('cd-s').textContent=pad(s);
    }
    tick(); setInterval(tick,1000);
    document.querySelectorAll('.next-show,.link').forEach((el,i)=>{
      el.style.setProperty('--delay',i*90+'ms');
    });
  </script>
